<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Nuestra Galería de Fotos 💕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fdfcfb 100%);
            background-attachment: fixed;
            color: #5c2e3f;
            overflow-x: hidden;
        }
        .app-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.1);
            border-bottom: 2px solid rgba(255, 182, 193, 0.5);
        }
        .app-header h1 { font-size: 1.5rem; color: #e74c6f; display: flex; align-items: center; gap: 10px; }
        .back-btn {
            background: #ffe6e6; color: #e74c6f; border: none;
            padding: 8px 15px; border-radius: 20px; font-family: 'Georgia', serif;
            font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        .back-btn:hover { background: #ff6b6b; color: white; }
        .gallery-container { padding: 15px; column-count: 2; column-gap: 12px; max-width: 900px; margin: 0 auto; }
        @media (min-width: 600px) { .gallery-container { column-count: 3; gap: 15px; } }
        @media (min-width: 900px) { .gallery-container { column-count: 4; } }
        .gallery-item {
            break-inside: avoid; margin-bottom: 12px; border-radius: 12px;
            overflow: hidden; cursor: pointer; position: relative; background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery-item:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2); }
        .gallery-item img { width: 100%; display: block; transition: filter 0.3s; }
        .gallery-item:hover img { filter: brightness(0.9); }
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; z-index: 1000; flex-direction: column;
        }
        .lightbox.show { display: flex; }
        .lightbox-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.8); color: white;
            position: absolute; top: 0; left: 0; width: 100%; z-index: 1010;
        }
        .lightbox-header .close-btn { font-size: 2rem; cursor: pointer; color: white; line-height: 1; transition: color 0.3s; }
        .lightbox-header .close-btn:hover { color: #ff6b6b; }
        .lightbox-header .counter { font-size: 1rem; color: #ccc; }
        .lightbox-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; }
        .lightbox-content img {
            max-width: 100%; max-height: 80vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 10px 40px rgba(255, 107, 107, 0.3); transition: transform 0.3s ease;
        }
        .lightbox-caption {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(255, 107, 107, 0.8); padding: 10px 25px;
            border-radius: 30px; font-style: italic; font-size: 1.1rem; text-align: center;
            max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); border: none; color: white;
            font-size: 2rem; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center;
            z-index: 1005; backdrop-filter: blur(5px);
        }
        .nav-btn:hover { background: rgba(255, 107, 107, 0.8); }
        .nav-btn.prev { left: 20px; }
        .nav-btn.next { right: 20px; }
        @media (max-width: 768px) { .nav-btn { display: none; } .lightbox-caption { bottom: 30px; font-size: 0.95rem; } }
        .swipe-animation { animation: swipe 0.3s ease-out; }
        @keyframes swipe { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>💕 Recuerdos</h1>
        <button class="back-btn" onclick="window.close()">Cerrar ✖</button>
    </header>

    <div class="gallery-container" id="galleryGrid"></div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-header">
            <span class="counter" id="lightboxCounter">1 / 1</span>
            <span class="close-btn" onclick="closeLightbox()">&times;</span>
        </div>
        <button class="nav-btn prev" onclick="changePhoto(-1)">❮</button>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Foto">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
        <button class="nav-btn next" onclick="changePhoto(1)">❯</button>
    </div>

    <script>
        // ========================================================
        // GENERADOR AUTOMÁTICO DE FOTOS
        // ========================================================
        const photos = [];
        
        // IMPORTANTE: Si tus fotos son .png o .jpeg, cambia "jpg" por tu formato
        const extension = "jpg"; 
        const totalFotos = 54; // Pon aquí el número total de tus fotos

        for (let i = 1; i <= totalFotos; i++) {
            photos.push({
                // Asume que las fotos están en la carpeta "fotos"
                url: `fotos/foto${i}.${extension}`, 
                caption: `Nuestro recuerdo #${i} 💕`
            });
        }

        let currentPhotoIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            photos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(index);
                item.innerHTML = `
                    <img src="${photo.url}" alt="${photo.caption}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x400/ff9a9e/ffffff?text=💔+Foto+no+encontrada'">
                `;
                grid.appendChild(item);
            });
        }

        function openLightbox(index) {
            currentPhotoIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const img = document.getElementById('lightboxImg');
            const caption = document.getElementById('lightboxCaption');
            const counter = document.getElementById('lightboxCounter');
            
            img.classList.remove('swipe-animation');
            void img.offsetWidth;
            img.classList.add('swipe-animation');

            img.src = photos[currentPhotoIndex].url;
            caption.textContent = photos[currentPhotoIndex].caption;
            counter.textContent = `${currentPhotoIndex + 1} / ${photos.length}`;
        }

        function changePhoto(direction) {
            currentPhotoIndex += direction;
            if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;
            if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
            updateLightbox();
        }

        const lightbox = document.getElementById('lightbox');
        lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        lightbox.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) changePhoto(1);
            if (touchEndX > touchStartX + swipeThreshold) changePhoto(-1);
        }

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('show')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') changePhoto(1);
            if (e.key === 'ArrowLeft') changePhoto(-1);
        });

        renderGallery();
    </script>
</body>
</html>
